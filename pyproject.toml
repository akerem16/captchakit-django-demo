[project]
name = "captchakit-django-demo"
version = "0.1.0"
description = "Django + DRF demo of captchakit: captcha-protected register, login and token API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "akerem16" }]
dependencies = [
    "captchakit[django,redis]>=1.0.2",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "redis>=5.0",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "dj-database-url>=2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "django-stubs[compatible-mypy]>=5.2,<6",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-cov>=7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# Pinned to the merge commit of akerem16/captchakit#1 until 1.0.2 is on PyPI.
captchakit = { git = "https://github.com/akerem16/captchakit", rev = "40ca28497416f905fc1126119285850fb4cab4cc" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF", "S", "PT", "RET", "DJ", "PL"]
# RUF001-003: the UI is Turkish on purpose ("ı" is not a typo for "i").
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["config", "captcha_demo", "accounts", "tests", "manage.py"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-ra --strict-markers --cov --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = ["redis: needs a real Redis server at TEST_REDIS_URL"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["config", "captcha_demo", "accounts"]
omit = ["*/migrations/*", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

{% csrf_token %}
{% if form.non_field_errors %}
  <div class="errors" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="field{% if field.errors %} has-error{% endif %}">
    <label{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}
    {% if field.errors %}<div class="errors" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
